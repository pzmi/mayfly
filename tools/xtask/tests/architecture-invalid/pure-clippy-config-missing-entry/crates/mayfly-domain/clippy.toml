# The semantic layer of the pure-crate rules (foundation.md section 2.3). The syntactic
# checker (`ARCH-domain-purity`) reads paths as written; Clippy resolves these after macro
# expansion, through type aliases, `Self`, associated types and re-exports. Every pure crate
# carries this file, and `ARCH-pure-clippy-config` fails when it is missing, shadowed by a
# `.clippy.toml`, or lacks an entry the checker requires. Clippy reads the nearest
# `clippy.toml` above the crate's manifest, so this one applies to this crate alone.
disallowed-methods = [
  # The clock: time arrives as a value (plan section 5.1).
  { path = "std::time::SystemTime::now", reason = "pure crate: time arrives as a value" },
  { path = "std::time::SystemTime::elapsed", reason = "pure crate: reads the clock" },
  { path = "std::time::Instant::now", reason = "pure crate: time arrives as a value" },
  { path = "std::time::Instant::elapsed", reason = "pure crate: reads the clock" },
  # The file system, also through `std::path`.
  { path = "std::fs::read", reason = "pure crate: no I/O" },
  { path = "std::fs::read_to_string", reason = "pure crate: no I/O" },
  { path = "std::fs::write", reason = "pure crate: no I/O" },
  { path = "std::fs::read_dir", reason = "pure crate: no I/O" },
  { path = "std::fs::metadata", reason = "pure crate: no I/O" },
  { path = "std::fs::symlink_metadata", reason = "pure crate: no I/O" },
  { path = "std::fs::canonicalize", reason = "pure crate: no I/O" },
  { path = "std::fs::exists", reason = "pure crate: no I/O" },
  { path = "std::fs::read_link", reason = "pure crate: no I/O" },
  { path = "std::fs::create_dir", reason = "pure crate: no I/O" },
  { path = "std::fs::create_dir_all", reason = "pure crate: no I/O" },
  { path = "std::fs::remove_file", reason = "pure crate: no I/O" },
  { path = "std::fs::remove_dir", reason = "pure crate: no I/O" },
  { path = "std::fs::remove_dir_all", reason = "pure crate: no I/O" },
  { path = "std::fs::rename", reason = "pure crate: no I/O" },
  { path = "std::fs::copy", reason = "pure crate: no I/O" },
  { path = "std::fs::hard_link", reason = "pure crate: no I/O" },
  { path = "std::fs::set_permissions", reason = "pure crate: no I/O" },
  { path = "std::fs::File::open", reason = "pure crate: no I/O" },
  { path = "std::fs::File::create", reason = "pure crate: no I/O" },
  { path = "std::fs::OpenOptions::open", reason = "pure crate: no I/O" },
  { path = "std::path::Path::try_exists", reason = "pure crate: reads the file system" },
  { path = "std::path::Path::is_file", reason = "pure crate: reads the file system" },
  { path = "std::path::Path::is_dir", reason = "pure crate: reads the file system" },
  { path = "std::path::Path::is_symlink", reason = "pure crate: reads the file system" },
  { path = "std::path::Path::metadata", reason = "pure crate: reads the file system" },
  { path = "std::path::Path::symlink_metadata", reason = "pure crate: reads the file system" },
  { path = "std::path::Path::read_dir", reason = "pure crate: reads the file system" },
  { path = "std::path::Path::read_link", reason = "pure crate: reads the file system" },
  { path = "std::path::Path::canonicalize", reason = "pure crate: reads the file system" },
  { path = "std::path::absolute", reason = "pure crate: reads the working directory" },
  # The environment and the process.
  { path = "std::env::var", reason = "pure crate: no environment" },
  { path = "std::env::var_os", reason = "pure crate: no environment" },
  { path = "std::env::vars", reason = "pure crate: no environment" },
  { path = "std::env::vars_os", reason = "pure crate: no environment" },
  { path = "std::env::args", reason = "pure crate: no environment" },
  { path = "std::env::args_os", reason = "pure crate: no environment" },
  { path = "std::env::current_dir", reason = "pure crate: no environment" },
  { path = "std::env::set_current_dir", reason = "pure crate: no environment" },
  { path = "std::env::current_exe", reason = "pure crate: no environment" },
  { path = "std::env::temp_dir", reason = "pure crate: no environment" },
  { path = "std::env::home_dir", reason = "pure crate: no environment" },
  { path = "std::env::set_var", reason = "pure crate: no environment" },
  { path = "std::env::remove_var", reason = "pure crate: no environment" },
  { path = "std::process::Command::new", reason = "pure crate: no process" },
  { path = "std::process::exit", reason = "pure crate: no process" },
  { path = "std::process::abort", reason = "pure crate: no process" },
  { path = "std::process::id", reason = "pure crate: no process" },
  # Threads.
  { path = "std::thread::spawn", reason = "pure crate: no threads" },
  { path = "std::thread::scope", reason = "pure crate: no threads" },
  { path = "std::thread::current", reason = "pure crate: no threads" },
  { path = "std::thread::sleep", reason = "pure crate: no threads, no clock" },
  { path = "std::thread::park", reason = "pure crate: no threads" },
  { path = "std::thread::park_timeout", reason = "pure crate: no threads, no clock" },
  { path = "std::thread::yield_now", reason = "pure crate: no threads" },
  { path = "std::thread::available_parallelism", reason = "pure crate: reads the host" },
  # Channels and process-global hooks.
  { path = "std::sync::mpsc::channel", reason = "pure crate: no global or shared state" },
  { path = "std::sync::mpsc::sync_channel", reason = "pure crate: no global or shared state" },
  { path = "std::panic::set_hook", reason = "pure crate: process-global state" },
  { path = "std::panic::take_hook", reason = "pure crate: process-global state" },
  { path = "std::io::Error::last_os_error", reason = "pure crate: reads the OS" },
  { path = "std::io::stdin", reason = "pure crate: no console" },
  { path = "std::io::stdout", reason = "pure crate: no console" },
  { path = "std::io::stderr", reason = "pure crate: no console" },
  { path = "std::backtrace::Backtrace::capture", reason = "pure crate: reads RUST_BACKTRACE" },
  { path = "std::backtrace::Backtrace::force_capture", reason = "pure crate: walks the stack" },
]
disallowed-types = [
  # Randomness: std hash containers iterate in a per-process random order.
  { path = "std::collections::HashMap", reason = "pure crate: use BTreeMap" },
  { path = "std::collections::HashSet", reason = "pure crate: use BTreeSet" },
  { path = "std::hash::RandomState", reason = "pure crate: randomness" },
  # I/O, processes and threads.
  { path = "std::fs::File", reason = "pure crate: no I/O" },
  { path = "std::fs::OpenOptions", reason = "pure crate: no I/O" },
  { path = "std::fs::DirEntry", reason = "pure crate: no I/O" },
  { path = "std::fs::ReadDir", reason = "pure crate: no I/O" },
  { path = "std::net::TcpStream", reason = "pure crate: no I/O" },
  { path = "std::net::TcpListener", reason = "pure crate: no I/O" },
  { path = "std::net::UdpSocket", reason = "pure crate: no I/O" },
  { path = "std::process::Command", reason = "pure crate: no process" },
  { path = "std::process::Child", reason = "pure crate: no process" },
  { path = "std::thread::Builder", reason = "pure crate: no threads" },
  { path = "std::thread::JoinHandle", reason = "pure crate: no threads" },
  { path = "std::time::Instant", reason = "pure crate: time arrives as a value" },
  { path = "std::backtrace::Backtrace", reason = "pure crate: reads RUST_BACKTRACE" },
  # Global and shared mutable state.
  { path = "std::sync::Mutex", reason = "pure crate: no shared mutable state" },
  { path = "std::sync::RwLock", reason = "pure crate: no shared mutable state" },
  { path = "std::sync::Condvar", reason = "pure crate: no shared mutable state" },
  { path = "std::sync::Once", reason = "pure crate: no global state" },
  { path = "std::sync::OnceLock", reason = "pure crate: no global state" },
  { path = "std::sync::LazyLock", reason = "pure crate: no global state" },
  { path = "std::sync::Barrier", reason = "pure crate: no shared state" },
  { path = "std::sync::atomic::AtomicBool", reason = "pure crate: no shared mutable state" },
  { path = "std::sync::atomic::AtomicI8", reason = "pure crate: no shared mutable state" },
  { path = "std::sync::atomic::AtomicI16", reason = "pure crate: no shared mutable state" },
  { path = "std::sync::atomic::AtomicI32", reason = "pure crate: no shared mutable state" },
  { path = "std::sync::atomic::AtomicI64", reason = "pure crate: no shared mutable state" },
  { path = "std::sync::atomic::AtomicIsize", reason = "pure crate: no shared mutable state" },
  { path = "std::sync::atomic::AtomicU8", reason = "pure crate: no shared mutable state" },
  { path = "std::sync::atomic::AtomicU16", reason = "pure crate: no shared mutable state" },
  { path = "std::sync::atomic::AtomicU32", reason = "pure crate: no shared mutable state" },
  { path = "std::sync::atomic::AtomicU64", reason = "pure crate: no shared mutable state" },
  { path = "std::sync::atomic::AtomicUsize", reason = "pure crate: no shared mutable state" },
  { path = "std::sync::atomic::AtomicPtr", reason = "pure crate: no shared mutable state" },
]
