# Pinned development tools (D15). `cargo xtask doctor` checks them, `cargo xtask
# install-tools [tool...]` installs the ones it can. Versions are exact; bump them here only.
# Only the tools a registered `check` stage needs are pinned: the task that adds a stage adds
# its tool here (Quint and Apalache with FND-06).
#
# method = "cargo"   : cargo install --locked <crate>@<version>
# method = "rustup"  : rustup toolchain install nightly-<date> --profile minimal
# method = "manual"  : not installable by xtask; `url` says where to get it
# method = "lockfile": version owned by a package-lock.json, noted here, not checked by doctor
# features = "a b"   : (method cargo) passed as --features to cargo install
#
# probe = [program, args...] is run to read the installed version; the output must contain
# the exact version as a whitespace-separated token (a leading "v" is ignored), or, with
# contains = true, as a substring.

# The test stages (`unit-tests`, `integration-tests`) and `platform-tests`: the runner, with the
# profiles of `.config/nextest.toml`.
[tools.cargo-nextest]
version = "0.9.148"
method = "cargo"
probe = ["cargo-nextest", "nextest", "--version"]

# The `coverage` and `changed-lines` stages: LLVM source-based line coverage over the nextest run
# (needs the `llvm-tools-preview` component of rust-toolchain.toml).
[tools.cargo-llvm-cov]
version = "0.9.1"
method = "cargo"
probe = ["cargo-llvm-cov", "llvm-cov", "--version"]

# The `deny` stage: advisories, licences, bans and sources against `deny.toml`.
[tools.cargo-deny]
version = "0.20.2"
method = "cargo"
probe = ["cargo-deny", "deny", "--version"]

# The `secrets` stage: the whole git history against `.gitleaks.toml` (D13). Install the
# release archive for the platform and check it against the release's checksums file.
[tools.gitleaks]
version = "8.30.1"
method = "manual"
url = "https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1"
probe = ["gitleaks", "version"]

# The `workflows` stage: actionlint over `.github/workflows`. Install the release archive for the
# platform; CI's `install-scanners` action pins the SHA-256 of the same release.
[tools.actionlint]
version = "1.7.12"
method = "manual"
url = "https://github.com/rhysd/actionlint/releases/tag/v1.7.12"
probe = ["actionlint", "-version"]

# actionlint runs shellcheck over every `run:` script and skips those checks without it, so the
# `workflows` stage requires it too. The version is the one Ubuntu 24.04 packages; CI installs
# the release binary through the install-scanners action, which pins its SHA-256.
[tools.shellcheck]
version = "0.9.0"
method = "manual"
url = "https://github.com/koalaman/shellcheck/releases/tag/v0.9.0"
probe = ["shellcheck", "--version"]
