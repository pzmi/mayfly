# migrations.lock: the SHA-256 of every store migration (`crates/*/src/migrations/**.sql`),
# checked by `cargo xtask architecture` (ARCH-migration-frozen; foundation.md section 6 rule 6).
# A migration is released once its line is here: it is never edited, removed or renamed again.
# A new migration adds its line in the commit that adds it (the checker prints the line).
# Format: `sha256sum` (`<64 lowercase hex>  <path>`), so `sha256sum -c migrations.lock` works too.
