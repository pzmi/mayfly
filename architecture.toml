# The dependency law of plan section 4 and foundation.md sections 2-3, checked by
# `cargo xtask architecture` (D1, D3).
# Every workspace crate is in exactly one category; a new crate gets its `members` entry and its
# entry here in the same commit. An architecture failure is fixed by fixing the structure, never
# by loosening this file (unless the task says so, with an ADR).
schema = 1

[workspace]
production = [
  "mayfly-domain", "mayfly-protocol",
  "mayfly-control-domain", "mayfly-control",
  "mayfly-data-domain", "mayfly-data",
  "mayfly-adapter-sqlite", "mayfly-adapter-github", "mayfly-adapter-secrets",
  "mayfly-adapter-tart", "mayfly-adapter-guest", "mayfly-adapter-host",
  "mayfly-adapter-link",
  "mayfly-composition", "mayfly-cli",
]
test_only = [
  "mayfly-testkit", "mayfly-testkit-shared", "mayfly-testkit-data", "mayfly-conformance",
  "mayfly-fake-tart", "mayfly-fake-github",
]
tool_only = ["xtask", "mayfly-faultlab"]

# Plane membership (foundation.md section 2.1, D1). Every production crate is in exactly one
# list. A control, data or shared crate never reaches a crate of a forbidden plane (the other
# plane; for a shared crate, either plane): not in [dependencies] below, and not over the
# resolved graph, where its own dev edges count as the first hop (ARCH-plane-separation,
# ADR 0019). Test-only crates are listed by the plane their production closure stays in.
[planes]
control = [
  "mayfly-control-domain", "mayfly-control",
  "mayfly-adapter-sqlite", "mayfly-adapter-github", "mayfly-adapter-secrets",
  "mayfly-testkit",
]
data = [
  "mayfly-data-domain", "mayfly-data",
  "mayfly-adapter-tart", "mayfly-adapter-guest", "mayfly-adapter-host",
  "mayfly-testkit-data",
]
shared = [
  "mayfly-domain", "mayfly-protocol", "mayfly-adapter-link",
  "mayfly-testkit-shared",
]
both = ["mayfly-composition", "mayfly-cli", "mayfly-conformance"]

# Names one plane owns (ARCH-plane-vocabulary): a crate of the other plane, or a shared crate,
# never writes them, through whatever crate they arrive.
[planes.vocabulary]
control = [
  "Journal", "MemoryJournal", "AggregateStore", "UnitOfWork", "ProjectionSpec",
  "ControlAggregates", "rusqlite",
]
data = ["VmProvider", "GuestTransport", "HostProbe", "ProcessRunner", "TartCli"]

# The crates the semantic rules select by role (foundation.md section 2.3).
[purity]
pure = ["mayfly-domain", "mayfly-protocol", "mayfly-control-domain", "mayfly-data-domain"]
# Crates with process authority. One module beyond them holds it too, by the checker's
# PROCESS_MODULES: mayfly-adapter-secrets::command, the `exec:` and Keychain runner (ADR 0058).
process_authority = ["mayfly-adapter-tart", "mayfly-adapter-guest", "mayfly-composition"]
independent = ["mayfly-faultlab", "mayfly-fake-tart", "mayfly-fake-github"]

# Allowed workspace edges (foundation.md section 2.2, plan section 4). A dev-dependency may
# target a test_only crate or a crate in the dependent's normal list, within the plane rule
# above. No production crate may reach a test_only or tool_only crate over normal or build
# edges, and the lists must be acyclic. CP and DP meet only in mayfly-domain and
# mayfly-protocol; only the `both` crates see both planes.
[dependencies.normal]
mayfly-domain = []
mayfly-protocol = ["mayfly-domain"]

mayfly-control-domain = ["mayfly-domain"]
mayfly-control = ["mayfly-control-domain", "mayfly-domain", "mayfly-protocol"]

mayfly-data-domain = ["mayfly-domain", "mayfly-protocol"]
mayfly-data = ["mayfly-data-domain", "mayfly-domain", "mayfly-protocol"]

# Control-plane adapters: the kernel and the application; the SQLite journal also decodes
# the control domain's events.
mayfly-adapter-sqlite = ["mayfly-control", "mayfly-control-domain", "mayfly-domain"]
mayfly-adapter-github = ["mayfly-control", "mayfly-domain"]
mayfly-adapter-secrets = ["mayfly-control", "mayfly-domain"]

# Data-plane adapters: the kernel and the application.
mayfly-adapter-tart = ["mayfly-data", "mayfly-domain"]
mayfly-adapter-guest = ["mayfly-data", "mayfly-domain"]
mayfly-adapter-host = ["mayfly-data", "mayfly-domain"]

# The CP<->DP transports carry protocol messages only.
mayfly-adapter-link = ["mayfly-protocol", "mayfly-domain"]

mayfly-composition = [
  "mayfly-domain", "mayfly-protocol",
  "mayfly-control-domain", "mayfly-control",
  "mayfly-data-domain", "mayfly-data",
  "mayfly-adapter-sqlite", "mayfly-adapter-github", "mayfly-adapter-secrets",
  "mayfly-adapter-tart", "mayfly-adapter-guest", "mayfly-adapter-host",
  "mayfly-adapter-link",
]
mayfly-cli = ["mayfly-composition"]

# The control plane's test kit (ADR 0019): its closure stays in the control plane and the
# shared crates, so control and shared crates may dev-depend on it and data crates may not.
# Data-plane test support is in mayfly-testkit-data, below. It uses the shared kit
# (the child-environment probe of the secrets contract, ADR 0058).
mayfly-testkit = [
  "mayfly-domain", "mayfly-protocol",
  "mayfly-control-domain", "mayfly-control",
  "mayfly-testkit-shared",
]
# The shared test kit (ADR 0019): plane-neutral test support, the poll helper and the link
# contract suite (DP-02), which speaks the protocol's types. Its closure is the shared crates
# only, so control and data crates, both planes' kits and the shared crates may dev-depend on it.
# For the two crates in its own closure (mayfly-domain, mayfly-protocol) that dev edge is a Cargo
# dev cycle: use the kit from their integration tests (`tests/`) only, which link the same build
# of the crate the kit does; in a unit test (`#[cfg(test)]` in `src/`) the kit's copy is another
# crate, and its types never match `crate::` ones. Not checked here: the compiler refuses the
# mix, and a type-free helper (the fixture reader in mayfly-protocol/tests/golden.rs) is sound.
mayfly-testkit-shared = ["mayfly-domain", "mayfly-protocol"]
# The data plane's test kit (ADR 0019, DP-01): the fake provider, image store, guest, host probe,
# floor, clock and link the executor's component tests run over. Its closure stays in the data
# plane and the shared crates, so data crates may dev-depend on it and control crates may not.
mayfly-testkit-data = [
  "mayfly-domain", "mayfly-protocol",
  "mayfly-data-domain", "mayfly-data",
]
# Conformance drives the production crates the Quint models govern, over the testkit, the
# Tart adapter included (fnd section 2.2). It sees both planes, so no plane crate may
# dev-depend on it.
mayfly-conformance = [
  "mayfly-testkit",
  "mayfly-domain", "mayfly-protocol",
  "mayfly-control-domain", "mayfly-control",
  "mayfly-data-domain", "mayfly-data",
  "mayfly-adapter-sqlite", "mayfly-adapter-tart", "mayfly-adapter-link",
  "mayfly-composition",
]

# Independent oracles (D11): the fakes implement their wire behaviour themselves and the fault
# lab drives the binaries, so none of them may reach a workspace crate.
mayfly-fake-tart = []
mayfly-fake-github = []
mayfly-faultlab = []
xtask = []

# Workspace build-dependencies; none are allowed unless listed here.
[dependencies.build]

# Third-party crates each workspace crate may use directly, by dependency kind. The value lists
# the features the dependency may enable ("default" stands for its default features), or is
# "*" for any. A crate allowed under `normal` is also allowed as a dev-dependency. A new
# dependency is added with `cargo add` and listed here in the same commit.
[external.normal]
mayfly-domain = { serde = ["default", "derive"] }
# Protocol messages are serde data (ADR 0010, ADR 0017); the encoding stays in the transports.
mayfly-protocol = { serde = ["default", "derive"] }
mayfly-control-domain = { serde = ["default", "derive"] }
mayfly-adapter-sqlite = { rusqlite = ["default", "bundled"], serde_json = ["default"] }
# AggregateStore encodes events and refusals and hashes intent digests (ADR 0041); tracing for the
# delivery worker's ERROR on a stream whose journal read falls short of its mark (ES-05F).
mayfly-control = { serde_json = ["default"], sha2 = ["default"], tracing = ["std"] }
mayfly-testkit = { serde_json = ["default"] }
# The link transports (plan section 3.3): bounded Tokio channels for inproc, JSON frames
# (ADR 0010) encoded and decoded on every send, in process too.
mayfly-adapter-link = { serde_json = ["default"], tokio = ["sync"] }
# The link contract suite (DP-02) runs each case on its own current-thread runtime with a paused
# clock (rt, time, test-util), and reads and writes raw JSON frames (ADR 0010).
mayfly-testkit-shared = { serde_json = ["default"], tokio = ["rt", "time", "test-util"] }
# The data plane's fakes share state between a test and the executor and wake waiters (a held
# provider call, the fake clock) through Tokio's synchronisation primitives only; no runtime.
mayfly-testkit-data = { tokio = ["sync"] }
# The secret providers (ADR 0033, ADR 0058): `O_NOFOLLOW` opens, the daemon's uid and the
# process-group kill through rustix; the command's exit and deadline, and the blocking hand-off
# of the file and executable checks, through Tokio.
mayfly-adapter-secrets = { rustix = ["default", "fs", "process"], tokio = ["rt", "process", "io-util", "time"] }
# The GitHub client (GH-02, ADR 0064): reqwest over rustls with the aws-lc-rs provider and the
# platform verifier (no OpenSSL, no native-tls, no bundled root store); RS256 App JWTs signed
# with the same aws-lc-rs from a PEM parsed by rustls-pki-types, base64url for the JWT parts,
# zeroize to wipe the key's DER buffer, url for endpoints, serde for the answers, Tokio's timer
# for attempt deadlines and its mutex for the single-flight refresh, tracing for the retry
# warning.
mayfly-adapter-github = { aws-lc-rs = ["default"], base64 = ["default"], reqwest = ["rustls-no-provider"], rustls = ["aws_lc_rs", "std", "tls12"], rustls-pki-types = ["default"], rustls-platform-verifier = ["default"], serde = ["default", "derive"], serde_json = ["default"], tokio = ["default", "time", "sync"], tracing = ["std"], url = ["default"], zeroize = ["default"] }
# The configuration is TOML read as a raw table (plan section 11); the state-dir lock is flock(2)
# through rustix, safe, with no libc (plan section 13).
mayfly-composition = { rustix = ["default", "fs", "process"], toml = ["default"] }
mayfly-fake-tart = { rustix = ["default", "process"], serde = ["default", "derive"], serde_json = ["default"], sha2 = ["default"], toml = ["default"] }
# The fake GitHub (GH-02, GH-01): an axum HTTP/1.1 server on Tokio; RS256 checked with
# aws-lc-rs's UnparsedPublicKey through the fake's own JWT and PEM code; synthetic PKCS#1 test
# keys generated at run time by the rsa crate (another implementation than the provider);
# base64url and serde for JWTs and bodies.
mayfly-fake-github = { aws-lc-rs = ["default"], axum = ["http1", "tokio"], base64 = ["default"], rsa = ["default", "pkcs1v15"], serde = ["default", "derive"], serde_json = ["default"], tokio = ["default", "rt", "net", "sync"] }
xtask = { cargo_metadata = ["default"], clap = ["default", "derive"], proc-macro2 = ["span-locations"], serde = ["default", "derive"], sha2 = ["default"], syn = ["parsing", "full", "visit", "clone-impls"], tempfile = ["default"], toml = ["default"], yaml-rust2 = [] }

[external.dev]
mayfly-domain = { proptest = ["std"] }
# The protocol golden fixtures are JSON (ver section 4).
mayfly-protocol = { serde_json = ["default"] }
# Properties of the capacity policy and the Host aggregate over generated inputs (KER-05).
mayfly-control-domain = { proptest = ["std"] }
mayfly-adapter-sqlite = { tempfile = ["default"] }
# The secret-provider contract runs on a current-thread runtime over tempdir sources; a oneshot
# cancels a call from another thread (SEC-02).
mayfly-adapter-secrets = { tempfile = ["default"], tokio = ["rt", "process", "io-util", "time", "sync"] }
mayfly-composition = { tempfile = ["default"] }
mayfly-control = { serde = ["default", "derive"] }
# The executor's component tests poll it and their script together on a current-thread runtime
# (`tokio::join!`), nothing spawned (DP-01).
mayfly-data = { tokio = ["rt", "macros"] }
mayfly-testkit = { serde = ["default", "derive"], tempfile = ["default"] }
mayfly-fake-tart = { tempfile = ["default"] }
# The client's tests run on a paused current-thread runtime (ver §3.2).
mayfly-adapter-github = { tokio = ["default", "rt", "macros", "test-util", "time", "sync"] }
mayfly-fake-github = { tokio = ["default", "macros", "rt", "net", "sync"] }

[external.build]

# Approved departures, each citing an ADR. `[exceptions.sources]` maps a non-crates.io source
# (without query or revision) to `{ adr = "NNNN" }`; `[[exceptions.lints]]` approves one
# `allow`/`expect`/`coverage(off)`/`todo!`, or a `#[macro_export]` (lint = "macro_export"), in
# one file: `{ path, lint, adr }`.
[exceptions]

# `event_set!` declares a crate's event enum and its codec (ADR 0018); the control plane's
# crates invoke it, so it is exported. Its body is checked as pure code where it is written and
# names only `$crate` items, serde through `$crate::__serde`, and core/std value types.
# The fake `tart` waits in real time (delays, guest jobs, `ip --wait`) in this one file (ADR 0023).
[[exceptions.lints]]
path = "crates/mayfly-fake-tart/src/wait.rs"
lint = "test_sleep"
adr = "0023"

[[exceptions.lints]]
path = "crates/mayfly-control-domain/src/event.rs"
lint = "macro_export"
adr = "0018"
