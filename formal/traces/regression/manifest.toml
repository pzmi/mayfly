# The committed regression traces and how each one is regenerated (ver §6.2; ES-06 exports the
# event store's, VER-01's `formal-freshness` stage checks them).
#
# Every trace listed here is regenerated with the locked Quint, from the repository root:
#
#   npx --prefix formal --no -- quint run --backend typescript --main <main> --init <init>
#     --step <step> --max-steps <max_steps> --mbt --seed <seed> --invariant <invariant>
#     --out-itf formal/traces/regression/<file> formal/<model>
#
# and must equal the committed file byte for byte, `#meta.description` and `#meta.timestamp`
# (the creation time Quint writes) excepted. The scripts are deterministic
# (`event_store_traces` in `formal/event_store.qnt`): `max_steps` is the length of the
# scenario's `List[Stim]`, one step per stimulus, and the seed is recorded only so that a
# regeneration is byte for byte. Each
# script takes exactly the stimuli of the `run` of the same name (`<step>Test`), so a scenario
# and its trace cannot drift; `mbt::actionTaken` is the model action and `last.stimulus` names
# it too. Every `*.itf.json` here has exactly one entry.

[[trace]]
file = "event_store-lostRace.itf.json"
model = "event_store.qnt"
main = "event_store_traces"
init = "tinit"
step = "lostRace"
max_steps = 4
seed = "0x5ce1"
invariant = "allInvariants"

