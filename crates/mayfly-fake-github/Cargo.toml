[package]
name = "mayfly-fake-github"
description = "Test-only: a Scale Set and REST fake server, an independent wire implementation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aws-lc-rs = "1.19.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23.1"
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "net", "sync"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
