[package]
name = "mayfly-control"
description = "Control-plane application: command bus, AggregateStore, projections, queries, reactors, reconciler, listener and durable consumers (directive relay, attempt saga), with the ports Journal, Clock, Ids, ScaleSetApi, RunnerRegistry and SecretProvider."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
mayfly-control-domain = { version = "0.1.0", path = "../mayfly-control-domain" }
mayfly-domain = { version = "0.1.0", path = "../mayfly-domain" }
mayfly-protocol = { version = "0.1.0", path = "../mayfly-protocol" }
serde_json = "1.0.154"
sha2 = "0.11.1"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
mayfly-testkit = { path = "../mayfly-testkit" }
serde = { version = "1.0.229", features = ["derive"] }
