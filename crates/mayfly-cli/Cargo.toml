[package]
name = "mayfly-cli"
description = "Binaries `mayflyd` (the daemon) and `mayfly` (the operator CLI)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "mayflyd"
path = "src/bin/mayflyd.rs"

[[bin]]
name = "mayfly"
path = "src/bin/mayfly.rs"

[lints]
workspace = true

[dependencies]
mayfly-composition = { version = "0.1.0", path = "../mayfly-composition" }

[dev-dependencies]
assert_cmd = "2.2.2"
mayfly-testkit-shared = { path = "../mayfly-testkit-shared" }
tempfile = "3.27.0"
