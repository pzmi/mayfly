[package]
name = "mayfly-cli"
description = "Binaries `mayflyd` (the daemon) and `mayfly` (the operator CLI)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "mayflyd"
path = "src/bin/mayflyd.rs"

[[bin]]
name = "mayfly"
path = "src/bin/mayfly.rs"

[lints]
workspace = true

[dependencies]
mayfly-composition = { version = "0.1.0", path = "../mayfly-composition" }

[dev-dependencies]
assert_cmd = "2.2.2"
mayfly-fake-github = { path = "../mayfly-fake-github" }
mayfly-fake-registry = { path = "../mayfly-fake-registry" }
mayfly-testkit-shared = { path = "../mayfly-testkit-shared" }
rustix = { version = "1.1.6", features = ["process"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "sync"] }
