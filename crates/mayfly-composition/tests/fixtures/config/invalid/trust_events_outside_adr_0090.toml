# Events outside ADR 0090's list are refused, known ones included (adding an event is a new
# decision), and a repository listed twice in another case is one repository listed twice.
schema_version = 1
state_dir = "/var/lib/mayfly"

[github]
organisation = "example-org"
app_client_id = "Iv1.0123456789abcdef"
installation_id = 12345678
private_key = "file:/etc/mayfly/app-key.pem"

[provider]
tart_home = "/var/lib/mayfly/tart"

[[pools]]
name = "mac"
tier = "trusted"
image_manifest = "/etc/mayfly/images/mac.toml"
guest_os = "macos"
cpu = 4
memory_mib = 8192
max_running = 2
allowed_repositories = ["example-org/app", "Example-Org/App"]
allowed_events = ["push", "pull_request_target", "workflow_run", "issue_comment"]
