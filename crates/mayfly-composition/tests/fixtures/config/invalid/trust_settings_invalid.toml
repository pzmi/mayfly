# Each trust setting refused with its reason (ADR 0090).
schema_version = 1
state_dir = "/var/lib/mayfly"

[github]
organisation = "example-org"
app_client_id = "Iv1.0123456789abcdef"
installation_id = 12345678
private_key = "file:/etc/mayfly/app-key.pem"
check_fork_pr_setting = "yes"

[provider]
tart_home = "/var/lib/mayfly/tart"

[[pools]]
name = "mac"
tier = "trusted"
image_manifest = "/etc/mayfly/images/mac.toml"
guest_os = "macos"
cpu = 4
memory_mib = 8192
max_running = 2
allowed_repositories = []
allowed_events = []

[[pools]]
name = "lin"
tier = "trusted"
image_manifest = "/etc/mayfly/images/lin.toml"
guest_os = "linux"
cpu = 2
memory_mib = 4096
max_running = 2
allowed_repositories = ["example-org/app", "app", "example-org/app"]
allowed_events = ["push", "pull_request_review", "push"]
cancel_refused_runs = 1
