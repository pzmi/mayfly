# The four secret reference schemes; the config holds references, never values.
schema_version = 1
state_dir = "/var/lib/mayfly"

[github]
organisation = "example-org"
app_client_id = "Iv1.0123456789abcdef"
installation_id = 1
private_key = "exec:/usr/local/bin/print-app-key"

[provider]
tart_home = "/var/lib/mayfly/tart"

[[pools]]
name = "mac"
tier = "trusted"
image_manifest = "/etc/mayfly/images/mac.toml"
guest_os = "macos"
cpu = 4
memory_mib = 8192
max_running = 2
