[package]
name = "mayfly-composition"
description = "Composition root: config, wiring, runtime, supervision tree, startup sequence and roles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
mayfly-domain = { version = "0.1.0", path = "../mayfly-domain" }
rustix = { version = "1.1.6", features = ["fs", "process"] }
toml = "1.2.1"

[dev-dependencies]
mayfly-adapter-link = { path = "../mayfly-adapter-link" }
mayfly-adapter-sqlite = { path = "../mayfly-adapter-sqlite" }
mayfly-control = { path = "../mayfly-control" }
mayfly-control-domain = { path = "../mayfly-control-domain" }
mayfly-data = { path = "../mayfly-data" }
mayfly-data-domain = { path = "../mayfly-data-domain" }
mayfly-protocol = { path = "../mayfly-protocol" }
mayfly-testkit = { path = "../mayfly-testkit" }
mayfly-testkit-data = { path = "../mayfly-testkit-data" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "sync"] }
