[package]
name = "mayfly-fake-tart"
description = "Test-only: a `tart`-compatible CLI over a state directory, with fault knobs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "tart"
path = "src/bin/tart.rs"

[lints]
workspace = true

[dependencies]
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
signal-hook = { version = "0.3.18", default-features = false, features = ["iterator"] }
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"
