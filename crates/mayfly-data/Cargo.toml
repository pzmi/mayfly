[package]
name = "mayfly-data"
description = "Data-plane application: the executor and inventory observer over the ports VmProvider, ImageStore, GuestTransport, HostProbe and ProcessClock."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
mayfly-data-domain = { version = "0.1.0", path = "../mayfly-data-domain" }
mayfly-domain = { version = "0.1.0", path = "../mayfly-domain" }
mayfly-protocol = { version = "0.1.0", path = "../mayfly-protocol" }

[dev-dependencies]
mayfly-testkit-data = { path = "../mayfly-testkit-data" }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros"] }
