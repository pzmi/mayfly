[package]
name = "mayfly-adapter-github"
description = "Control-plane adapter: GitHub App JWT and installation tokens, Scale Set client, JIT runner configs and classic runner registration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aws-lc-rs = "1.19.0"
base64 = "0.23.1"
mayfly-control = { version = "0.1.0", path = "../mayfly-control" }
mayfly-domain = { version = "0.1.0", path = "../mayfly-domain" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pki-types = "1.15.1"
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["time", "sync"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
url = "2.5.8"
zeroize = "1.9.1"

[dev-dependencies]
mayfly-fake-github = { path = "../mayfly-fake-github" }
mayfly-testkit = { path = "../mayfly-testkit" }
tokio = { version = "1.54.1", features = ["rt", "macros", "test-util"] }
