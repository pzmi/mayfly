[package]
name = "mayfly-adapter-link"
description = "Shared adapter: in-process and Unix-domain-socket transports for the protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
mayfly-domain = { version = "0.1.0", path = "../mayfly-domain" }
mayfly-protocol = { version = "0.1.0", path = "../mayfly-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["sync"] }

[dev-dependencies]
mayfly-testkit-shared = { version = "0.1.0", path = "../mayfly-testkit-shared" }
