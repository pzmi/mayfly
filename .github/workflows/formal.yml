name: Formal

# The Apalache lane of the Quint models (verification.md section 6.3, D10, D15): `quint verify`
# through the Apalache release pinned in tools/versions.toml (bounded model checking of every
# model's invariants) and a multi-seed simulation far larger than a per-push gate samples. The
# blocking part, typecheck and the Quint tests, is the `formal` job of ci.yml and runs on every
# push and pull request; this lane is not part of `cargo xtask check`. It runs weekly and by hand
# only (owner, 2026-11-10: "We want to run it on a weekly ci only"), never on a push or a pull
# request. A red run is fixed, never muted.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # One job per model of MODELS (tools/xtask/src/formal.rs), in parallel, each running that
  # model's bounded relations two at a time and then its simulation, so each fits its own
  # timeout. A timeout is about three times the model's last measured run with its setup
  # (doc/formal-models.md): event_store's storeOnlyStep alone took about 78 minutes at depth 4
  # in the sandbox. An xtask test keeps this list equal to MODELS (formal_verify.rs,
  # should_verify_every_model_in_its_own_job_when_the_formal_workflow_is_read).
  verify:
    name: Formal verification (${{ matrix.model }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: smoke
            timeout: 20
          - model: lifecycle
            timeout: 45
          - model: link
            timeout: 45
          - model: scheduling
            timeout: 60
          - model: recovery
            timeout: 90
          - model: registration
            timeout: 45
          - model: scaleset
            timeout: 45
          - model: event_store
            timeout: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # target/ holds the downloaded Apalache tarball too; it is re-hashed before every use.
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          job: formal-verify

      # Node 22 is the line tools/versions.toml pins (its probe refuses any other major).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Quint is locked by formal/package-lock.json; npx never fetches it.
      - name: Install Quint
        run: npm ci --prefix formal

      # Apalache 0.62.1 requires Java 21 (tools/versions.toml), installed explicitly here.
      - name: Set up Java for Apalache
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Show the JVM
        run: java -version

      # formal-verify fetches the pinned release itself, refuses it unless its SHA-256 equals the
      # one in tools/versions.toml, and unpacks it into ~/.quint before Quint runs, so ~/.quint is
      # never cached: what runs is always unpacked from a verified tarball. The base seed of the
      # simulation is printed; QUINT_SEED=<seed> cargo xtask formal-verify --model <model>
      # repeats it. A missing JVM or Apalache fails here with what to install, never a skip.
      - name: Verify
        run: cargo xtask formal-verify --model ${{ matrix.model }}

      # The log of every run, Apalache's run directories with a counterexample as ITF and TLA+
      # when it found one, and the ITF trace of a failing simulation.
      - name: Keep the counterexamples of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-verify-${{ matrix.model }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/formal-verify/
          if-no-files-found: warn
          retention-days: 30

  # Conformance at a weekly budget (verification.md section 6.2, VER-01): 1000 seeded traces of 50
  # steps per relation of every driven model, replayed through mayfly-conformance's drivers with
  # the regression traces. The per-push budget (10 traces of 25 steps per relation) is the
  # `conformance-replay` stage of ci.yml's `formal` job. The seed is printed; `cargo xtask
  # conformance --seed <seed> --traces 1000 --steps 50` repeats a failed run (about a minute
  # in the sandbox).
  conformance:
    name: Conformance (weekly budget)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          job: formal

      # Node 22 is the line tools/versions.toml pins (its probe refuses any other major).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Quint is locked by formal/package-lock.json; npx never fetches it.
      - name: Install Quint
        run: npm ci --prefix formal

      - name: Conformance
        run: cargo xtask conformance --traces 1000 --steps 50

      # The generated traces and their manifest, for the printed seed.
      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/conformance/
          if-no-files-found: warn
          retention-days: 30
