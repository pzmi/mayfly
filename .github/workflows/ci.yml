name: CI

# The blocking gate, one job per lane of foundation.md section 7.2, each running
# `cargo xtask check --only <stages>` so a job and the same command on a laptop run the same
# stage code. `required` needs every job and is the one result to watch.
# tools/xtask/src/check.rs (should_cover_each_in_check_stage_once_when_ci_jobs_are_read) fails
# when an `in_check` stage of the catalog is in no job or in two, so no stage is dropped
# silently, and fails when any step of a job other than `required` has `continue-on-error` or
# an `if:` (the macOS build and `doctor` gate as much as `check --only`). Every job installs
# only the tools its stages need.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every push to main is verified (foundation.md section 7.3): on main each commit has its own
# group, so a newer push neither cancels nor replaces a pending run; a pull request's newer
# push cancels its stale run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  architecture:
    name: Architecture and policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          job: architecture

      - name: Architecture and policy
        run: cargo xtask check --only architecture

      - name: Save caches (main only)
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.cache-key }}
          hit: ${{ steps.rust.outputs.cache-hit }}

  # `doctor` runs first and fails unless every tool a `check` stage needs is installed at its
  # pinned version, so this job installs the whole gate toolset: CI's toolset is asserted the
  # same way as a laptop's (foundation.md section 8).
  static:
    name: Static quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          job: static
          tools: cargo-deny cargo-nextest cargo-llvm-cov

      - name: Install Gitleaks, actionlint and shellcheck
        uses: ./.github/actions/install-scanners

      # Node 22 is the line tools/versions.toml pins (its probe refuses any other major), and
      # `doctor` checks the locked Quint in formal/node_modules too.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Quint
        run: npm ci --prefix formal

      - name: Pinned tools
        run: cargo xtask doctor

      - name: Static quality and docs
        run: cargo xtask check --only fmt-check,clippy,docs

      - name: Save caches (main only)
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.cache-key }}
          hit: ${{ steps.rust.outputs.cache-hit }}

  # The Quint models (verification.md section 6, D10): typecheck every formal/*.qnt, run each
  # model's tests, check the committed regression traces are fresh and replay them with seeded
  # generated traces through the conformance drivers (VER-01; the seed is printed). Quint is
  # locked by formal/package-lock.json; npx never fetches it, and a missing Node or Quint fails
  # the stage (D15). The Apalache lane and the weekly conformance budget are formal.yml's.
  formal:
    name: Formal models (Quint)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          job: formal

      # Node 22 is the line tools/versions.toml pins (its probe refuses any other major).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Quint
        run: npm ci --prefix formal

      - name: Formal models
        run: cargo xtask check --only formal-typecheck,formal-test,formal-freshness,conformance-replay

      - name: Save caches (main only)
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.cache-key }}
          hit: ${{ steps.rust.outputs.cache-hit }}

  # The product targets aarch64-apple-darwin (D2): Clippy over every target for it, warnings
  # denied, so a macOS-only compile error or lint shows here, in a Linux minute, before the
  # native `macos` job.
  cross:
    name: Cross check (aarch64-apple-darwin)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          job: cross

      - name: Install the macOS target
        run: rustup target add aarch64-apple-darwin

      - name: Cross check
        run: cargo xtask check --only cross-check

      - name: Save caches (main only)
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.cache-key }}
          hit: ${{ steps.rust.outputs.cache-hit }}

  # xtask's fixture tests run the real cargo-deny, Gitleaks and actionlint, so this job
  # installs them; the runner is nextest.
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          job: tests
          tools: cargo-deny cargo-nextest

      - name: Install Gitleaks, actionlint and shellcheck
        uses: ./.github/actions/install-scanners

      - name: Tests
        run: cargo xtask check --only unit-tests,integration-tests,doctests

      - name: Save caches (main only)
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.cache-key }}
          hit: ${{ steps.rust.outputs.cache-hit }}

  # The product crates' unit and integration tests on the native macOS arm64 runner, because
  # the code under test is the operating system's: processes, sockets, signals (D2). It installs
  # no scanners (they are Linux x86-64 only) and so runs `cargo xtask test --only
  # platform-tests`, which leaves out the xtask package whose fixtures need them; every `check`
  # stage stays in exactly one other job.
  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 45
    # The native build denies warnings like every other build of the gate.
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          job: macos
          tools: cargo-nextest

      - name: Build
        run: cargo build --workspace --locked

      - name: Platform tests
        run: cargo xtask test --only platform-tests

      - name: Save caches (main only)
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.cache-key }}
          hit: ${{ steps.rust.outputs.cache-hit }}

  # Line coverage of the whole nextest run against `coverage-floor.toml`, then the changed lines
  # against the merge base. Full history, so the merge base with `origin/main` exists. It
  # installs the scanners because xtask's fixture tests run them under instrumentation.
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # changed-lines diffs against the merge base with origin/main

      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          job: coverage
          tools: cargo-deny cargo-nextest cargo-llvm-cov

      - name: Install Gitleaks, actionlint and shellcheck
        uses: ./.github/actions/install-scanners

      - name: Coverage and changed lines
        run: cargo xtask check --only coverage,changed-lines

      - name: Save caches (main only)
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.cache-key }}
          hit: ${{ steps.rust.outputs.cache-hit }}

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the secrets stage scans the whole history

      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          job: security
          tools: cargo-deny

      - name: Install Gitleaks, actionlint and shellcheck
        uses: ./.github/actions/install-scanners

      - name: Security
        run: cargo xtask check --only deny,secrets,workflows,action-pins

      - name: Save caches (main only)
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.cache-key }}
          hit: ${{ steps.rust.outputs.cache-hit }}

  # The one result to watch (and, if the owner adds a ruleset, to require). It runs even when a
  # needed job failed or was cancelled and fails then; a needed job that was skipped fails it
  # too, so a job can never drop out of the gate by not running.
  required:
    name: Required
    if: ${{ always() }}
    needs:
      - architecture
      - static
      - cross
      - tests
      - formal
      - macos
      - coverage
      - security
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
