name: Bug report
description: Report incorrect behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here; use the private advisory link on the issue chooser.
        Never paste tokens, JIT configs, private keys or other credentials.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, configuration (redacted) and the VM provider and scale set involved.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `mayfly --version`, or the git commit.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Host operating system
      options:
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Once it exists, the output of `mayfly diagnostics export` (redacted by default). Check it for anything private before pasting; never tokens or credentials.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines, with secrets and private names removed.
      render: text
